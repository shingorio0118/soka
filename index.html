<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2330">
<title>草加駅前</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="草加駅前のマップ"></canvas>

<header id="title">草加駅前</header>
<button id="mapbtn" type="button" aria-pressed="false">地図</button>
<div id="place" hidden></div>
<div id="mini" hidden><canvas id="minicv" aria-label="全体地図"></canvas></div>
<div id="hint">十字キー / WASD で歩けます</div>

<div id="dpad" aria-label="十字ボタン">
  <button type="button" data-dir="up" aria-label="上"><i></i></button>
  <button type="button" data-dir="left" aria-label="左"><i></i></button>
  <span class="mid"></span>
  <button type="button" data-dir="right" aria-label="右"><i></i></button>
  <button type="button" data-dir="down" aria-label="下"><i></i></button>
</div>

<footer id="attr">地図データ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL)</footer>
<noscript>このページはJavaScriptが必要です。</noscript>
<script src="src/game.js"></script>
</body>
</html>
